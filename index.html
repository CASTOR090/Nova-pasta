<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0f4c3a, #1a5f4a);
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .roulette-container {
            position: relative;
            margin: 20px 0;
        }

        .roulette-wheel {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, #8B4513 60%, #654321 100%);
            border: 15px solid #8B4513;
            position: relative;
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .number-slot {
            position: absolute;
            width: 30px;
            height: 60px;
            transform-origin: 15px 200px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: white;
            padding-top: 5px;
        }

        .red { background: #DC143C; }
        .black { background: #000000; }
        .green { background: #228B22; }

        .roulette-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #FFD700, #DAA520);
            border-radius: 50%;
            border: 5px solid #8B4513;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }

        .inner-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: #228B22;
            border: 3px solid #FFD700;
        }

        .roulette-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #FFD700;
            z-index: 10;
        }

        .controls {
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .bet-section {
            margin: 10px 0;
        }

        input, button {
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            background: #228B22;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #32CD32;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .result {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            background: rgba(0,0,0,0.7);
        }

        .bet-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .bet-button {
            padding: 15px;
            background: #444;
            border: 2px solid #666;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .bet-button:hover {
            background: #555;
            border-color: #888;
        }

        .bet-button.selected {
            background: #228B22;
            border-color: #32CD32;
        }

        .bet-button.red { background: #DC143C !important; }
        .bet-button.black { background: #000000 !important; }
        .bet-button.green { background: #228B22 !important; }
    </style>
</head>
<body>
    <h1>🎰 Roleta Europeia</h1>
    
    <div class="roulette-container">
        <div class="roulette-pointer"></div>
        <div class="roulette-wheel" id="wheel">
            <div class="inner-ring"></div>
            <div class="roulette-center"></div>
        </div>
    </div>

    <div class="controls">
        <div class="bet-section">
            <label>Valor da Aposta:</label>
            <input type="number" id="betAmount" value="10" min="1" max="1000">
        </div>

        <div class="bet-options">
            <div class="bet-button red" data-bet="red">Vermelho (2x)</div>
            <div class="bet-button black" data-bet="black">Preto (2x)</div>
            <div class="bet-button green" data-bet="green">Verde (36x)</div>
            <div class="bet-button" data-bet="even">Par (2x)</div>
            <div class="bet-button" data-bet="odd">Ímpar (2x)</div>
            <div class="bet-button" data-bet="low">1-18 (2x)</div>
        </div>

        <button id="spinBtn">🎲 GIRAR ROLETA</button>
    </div>

    <div id="result" class="result" style="display: none;"></div>

    <script>
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const resultDiv = document.getElementById('result');
        const betButtons = document.querySelectorAll('.bet-button');
        const betAmountInput = document.getElementById('betAmount');

        // Números da roleta europeia na ordem correta
        const rouletteNumbers = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
        const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

        let selectedBet = null;
        let spinning = false;

        // Criar números na roleta
        function createRouletteNumbers() {
            rouletteNumbers.forEach((number, index) => {
                const slot = document.createElement('div');
                slot.className = 'number-slot';
                slot.textContent = number;
                
                if (number === 0) {
                    slot.classList.add('green');
                } else if (redNumbers.includes(number)) {
                    slot.classList.add('red');
                } else {
                    slot.classList.add('black');
                }
                
                const angle = (360 / rouletteNumbers.length) * index;
                slot.style.transform = `rotate(${angle}deg)`;
                
                wheel.appendChild(slot);
            });
        }

        createRouletteNumbers();

        // Seleção de aposta
        betButtons.forEach(button => {
            button.addEventListener('click', () => {
                betButtons.forEach(b => b.classList.remove('selected'));
                button.classList.add('selected');
                selectedBet = button.dataset.bet;
            });
        });

        spinBtn.addEventListener('click', async () => {
            if (!selectedBet) {
                alert('Selecione um tipo de aposta!');
                return;
            }

            if (spinning) return;

            const betAmount = parseInt(betAmountInput.value);
            if (betAmount < 1) {
                alert('Valor mínimo de aposta é 1!');
                return;
            }

            spinning = true;
            spinBtn.disabled = true;
            spinBtn.textContent = '🎲 GIRANDO...';
            resultDiv.style.display = 'none';

            try {
                // Inicia o giro
                const spinResponse = await fetch('http://localhost:5000/api/spin', {
                    method: 'POST'
                });

                if (!spinResponse.ok) {
                    throw new Error('Erro ao iniciar giro');
                }

                // Animação da roleta
                const randomRotation = 1440 + Math.random() * 1440;
                wheel.style.transform = `rotate(${randomRotation}deg)`;

                // Aguarda resultado
                let result = null;
                while (!result) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                    const resultResponse = await fetch('http://localhost:5000/api/result');
                    const data = await resultResponse.json();
                    
                    if (data.status === 'finished') {
                        result = data.result;
                        break;
                    }
                }

                // Exibe resultado
                setTimeout(() => {
                    displayResult(result, selectedBet, betAmount);
                    spinning = false;
                    spinBtn.disabled = false;
                    spinBtn.textContent = '🎲 GIRAR ROLETA';
                }, 3000);

            } catch (error) {
                console.error('Erro:', error);
                alert('Erro de conexão com o servidor!');
                spinning = false;
                spinBtn.disabled = false;
                spinBtn.textContent = '🎲 GIRAR ROLETA';
            }
        });

        function displayResult(result, bet, amount) {
            const { number, color } = result;
            let won = false;
            let payout = 0;

            switch (bet) {
                case 'red':
                    won = color === 'red';
                    payout = won ? amount * 2 : 0;
                    break;
                case 'black':
                    won = color === 'black';
                    payout = won ? amount * 2 : 0;
                    break;
                case 'green':
                    won = color === 'green';
                    payout = won ? amount * 36 : 0;
                    break;
                case 'even':
                    won = number > 0 && number % 2 === 0;
                    payout = won ? amount * 2 : 0;
                    break;
                case 'odd':
                    won = number > 0 && number % 2 === 1;
                    payout = won ? amount * 2 : 0;
                    break;
                case 'low':
                    won = number >= 1 && number <= 18;
                    payout = won ? amount * 2 : 0;
                    break;
            }

            resultDiv.innerHTML = `
                <div>🎯 Resultado: <span class="${color}">${number} (${color.toUpperCase()})</span></div>
                <div>${won ? '🎉 VOCÊ GANHOU!' : '😔 Você perdeu'}</div>
                <div>💰 ${won ? `Ganhou: ${payout}` : `Perdeu: ${amount}`}</div>
            `;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
