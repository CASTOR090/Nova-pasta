<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator - Java Backend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        .nav-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: transform 0.2s;
        }
        .nav-btn:hover {
            transform: scale(1.05);
        }
        .game-area {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            padding: 40px;
            border-radius: 15px;
            margin: 20px 0;
            position: relative;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .trajectory-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .trajectory-line svg {
            width: 100%;
            height: 100%;
        }
        .city {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            transition: transform 0.1s linear;
        }
        .building {
            background: linear-gradient(to right, #555, #777);
            border-radius: 2px 2px 0 0;
            position: relative;
            box-shadow: -2px 0 5px rgba(0,0,0,0.3);
        }
        .building::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 8px,
                rgba(255,255,255,0.1) 8px,
                rgba(255,255,255,0.1) 10px
            );
        }
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50px;
            opacity: 0.6;
            transition: transform 0.1s linear;
        }
        .multiplier {
            font-size: 4em;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            transition: color 0.3s;
        }
        .multiplier.crashed {
            color: #ff4444;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
        }
        .plane {
            font-size: 3em;
            position: absolute;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }
        .crashed {
            color: #ff4444;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-direction: column;
        }
        .bet-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        input {
            padding: 12px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            width: 150px;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-start {
            background: #00ff88;
            color: #000;
        }
        .btn-cashout {
            background: #ffd700;
            color: #000;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .stat {
            display: flex;
            flex-direction: column;
        }
        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 5px;
        }
        .message {
            margin-top: 15px;
            font-size: 1.2em;
            min-height: 30px;
            font-weight: bold;
        }
        .win {
            color: #00ff88;
        }
        .lose {
            color: #ff4444;
        }
        .server-status {
            font-size: 0.9em;
            margin-bottom: 10px;
            padding: 5px;
            border-radius: 5px;
        }
        .online {
            background: rgba(0, 255, 136, 0.2);
        }
        .offline {
            background: rgba(255, 68, 68, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="nav-btn" onclick="window.location.href='home.html'">🏠 HOME</button>
        <div class="server-status" id="serverStatus">Conectando ao servidor...</div>
        <h1>✈️ AVIATOR</h1>
        
        <div class="game-area">
            <div class="trajectory-line">
                <svg>
                    <line id="trajectoryLine" x1="10%" y1="100%" x2="10%" y2="100%" stroke="#ff4444" stroke-width="3" stroke-dasharray="5,5" opacity="0.5"/>
                </svg>
            </div>
            <div class="cloud" style="width: 60px; height: 25px; top: 20%; left: 15%;"></div>
            <div class="cloud" style="width: 80px; height: 30px; top: 40%; left: 70%;"></div>
            <div class="cloud" style="width: 50px; height: 20px; top: 60%; left: 40%;"></div>
            <div class="city" id="city">
                <div class="building" style="width: 40px; height: 60px;"></div>
                <div class="building" style="width: 35px; height: 75px;"></div>
                <div class="building" style="width: 45px; height: 50px;"></div>
                <div class="building" style="width: 38px; height: 65px;"></div>
                <div class="building" style="width: 42px; height: 55px;"></div>
                <div class="building" style="width: 36px; height: 70px;"></div>
                <div class="building" style="width: 40px; height: 60px;"></div>
            </div>
            <div class="plane" id="plane">✈️</div>
            <div class="multiplier" id="multiplier">1.00x</div>
        </div>

        <div class="controls">
            <div class="bet-controls">
                <input type="number" id="betAmount" value="10" min="1" placeholder="Aposta">
                <button class="btn-start" id="startBtn" onclick="startGame()">APOSTAR</button>
            </div>
            <button class="btn-cashout" id="cashoutBtn" onclick="cashout()" disabled>SACAR</button>
        </div>

        <div class="message" id="message"></div>

        <div class="stats">
            <div class="stat">
                <span class="stat-label">Saldo</span>
                <span class="stat-value" id="balance">R$ 0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Última Aposta</span>
                <span class="stat-value" id="lastBet">R$ 0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Último Ganho</span>
                <span class="stat-value" id="lastWin">R$ 0</span>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api';
        let gameInterval;
        let planePosition = { x: 10, y: 20 };
        let cityOffset = 0;
        let cloudOffset = 0;
        let isPlaying = false;

        async function checkServer() {
            try {
                const response = await fetch(`${API_URL}/status`);
                const data = await response.json();
                document.getElementById('serverStatus').textContent = '🟢 Servidor Online';
                document.getElementById('serverStatus').className = 'server-status online';
                updateBalance(data.balance);
                return true;
            } catch (error) {
                document.getElementById('serverStatus').textContent = '🔴 Servidor Offline';
                document.getElementById('serverStatus').className = 'server-status offline';
                return false;
            }
        }

        async function startGame() {
            const betAmount = parseFloat(document.getElementById('betAmount').value);
            
            try {
                const response = await fetch(`${API_URL}/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bet: betAmount })
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    showMessage('Aposta inválida!', 'lose');
                    return;
                }

                isPlaying = true;
                planePosition = { x: 10, y: 20 };
                cityOffset = 0;
                cloudOffset = 0;
                
                document.getElementById('startBtn').disabled = true;
                document.getElementById('cashoutBtn').disabled = false;
                document.getElementById('betAmount').disabled = true;
                document.getElementById('message').textContent = '';
                document.getElementById('lastBet').textContent = `R$ ${betAmount.toFixed(2)}`;
                
                updateBalance(data.balance);
                animatePlane();
                
                gameInterval = setInterval(updateGame, 50);
            } catch (error) {
                showMessage('Erro ao conectar com servidor!', 'lose');
            }
        }

        async function updateGame() {
            try {
                const response = await fetch(`${API_URL}/update`);
                const data = await response.json();
                
                document.getElementById('multiplier').textContent = `${data.multiplier.toFixed(2)}x`;
                
                if (data.crashed) {
                    crash();
                }
            } catch (error) {
                console.error('Erro ao atualizar jogo:', error);
            }
        }

        async function cashout() {
            if (!isPlaying) return;
            
            try {
                const response = await fetch(`${API_URL}/cashout`, { method: 'POST' });
                const data = await response.json();
                
                document.getElementById('lastWin').textContent = `R$ ${data.winAmount.toFixed(2)}`;
                showMessage(`Você ganhou R$ ${data.winAmount.toFixed(2)}!`, 'win');
                updateBalance(data.balance);
                
                endGame();
            } catch (error) {
                showMessage('Erro ao sacar!', 'lose');
            }
        }

        function crash() {
            document.getElementById('multiplier').classList.add('crashed');
            document.getElementById('lastWin').textContent = `R$ 0.00`;
            showMessage('CRASH! Você perdeu!', 'lose');
            endGame();
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('cashoutBtn').disabled = true;
            document.getElementById('betAmount').disabled = false;
            
            setTimeout(() => {
                document.getElementById('multiplier').classList.remove('crashed');
                const plane = document.getElementById('plane');
                plane.style.left = '10%';
                plane.style.bottom = '20%';
                plane.style.transform = 'rotate(0deg)';
                document.getElementById('city').style.transform = 'translateY(0)';
                const line = document.getElementById('trajectoryLine');
                line.setAttribute('x2', '10%');
                line.setAttribute('y2', '100%');
                const clouds = document.querySelectorAll('.cloud');
                clouds.forEach(cloud => {
                    cloud.style.transform = 'translate(0, 0)';
                });
            }, 1000);
        }

        function animatePlane() {
            if (!isPlaying) return;
            
            planePosition.x += 0.4;
            planePosition.y += 0.4;
            
            const plane = document.getElementById('plane');
            const rotation = -30;
            const x = Math.min(planePosition.x, 75);
            const y = Math.min(planePosition.y, 80);
            
            plane.style.left = `${x}%`;
            plane.style.bottom = `${y}%`;
            plane.style.transform = `rotate(${rotation}deg)`;
            
            const line = document.getElementById('trajectoryLine');
            line.setAttribute('x2', `${x}%`);
            line.setAttribute('y2', `${100 - y}%`);
            
            cityOffset += 0.6;
            const city = document.getElementById('city');
            city.style.transform = `translateY(${cityOffset}px)`;
            
            cloudOffset += 0.3;
            const clouds = document.querySelectorAll('.cloud');
            clouds.forEach((cloud, index) => {
                const speed = 1 + (index * 0.2);
                cloud.style.transform = `translate(-${cloudOffset * speed}px, ${cloudOffset * 0.5}px)`;
            });
            
            if (isPlaying) {
                requestAnimationFrame(animatePlane);
            }
        }

        function updateBalance(balance) {
            document.getElementById('balance').textContent = `R$ ${balance.toFixed(2)}`;
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
        }

        checkServer();
        setInterval(checkServer, 5000);
    </script>
</body>
</html>
