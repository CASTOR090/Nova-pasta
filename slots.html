<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caça-Níqueis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        }
        h1 {
            font-size: 3em;
            margin-bottom: 30px;
            color: #ffd700;
        }
        .nav-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .machine {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            padding: 40px;
            border-radius: 20px;
            border: 5px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            position: relative;
        }
        .lever-container {
            position: absolute;
            right: -60px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }
        .lever {
            width: 20px;
            height: 150px;
            background: linear-gradient(to bottom, #8B4513, #654321);
            border-radius: 10px;
            position: relative;
            transition: transform 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .lever.pulled {
            transform: translateY(80px);
        }
        .lever-handle {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #ff0000, #cc0000);
            border-radius: 50%;
            border: 3px solid #ffd700;
            box-shadow: 0 4px 12px rgba(255, 0, 0, 0.6);
        }
        .slots {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
        }
        .slot {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            border: 4px solid #333;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.3);
        }
        .controls {
            margin: 30px 0;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        input {
            padding: 15px;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            width: 150px;
            text-align: center;
        }
        button {
            padding: 15px 40px;
            font-size: 1.3em;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.5);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 10px;
        }
        .stat-label {
            font-size: 1em;
            opacity: 0.8;
        }
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            margin-top: 5px;
        }
        .message {
            margin-top: 20px;
            font-size: 1.8em;
            min-height: 40px;
            font-weight: bold;
        }
        .win { color: #00ff88; }
        .lose { color: #ff4444; }
        @keyframes spin {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .spinning {
            animation: spin 0.1s infinite;
        }
    </style>
</head>
<body>
    <button class="nav-btn" onclick="window.location.href='home.html'">🏠 HOME</button>

    <div class="container">
        <h1>🎰 CAÇA-NÍQUEIS</h1>
        
        <div class="machine">
            <div class="lever-container" id="leverContainer" onclick="pullLever()">
                <div class="lever" id="lever">
                    <div class="lever-handle"></div>
                </div>
            </div>
            
            <div class="slots">
                <div class="slot" id="slot1">🍒</div>
                <div class="slot" id="slot2">🍋</div>
                <div class="slot" id="slot3">🍊</div>
            </div>

            <div class="controls">
                <input type="number" id="betAmount" value="10" min="1" placeholder="Aposta">
            </div>

            <div class="message" id="message"></div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Saldo</div>
                <div class="stat-value" id="balance">R$ 1000</div>
            </div>
            <div class="stat">
                <div class="stat-label">Última Aposta</div>
                <div class="stat-value" id="lastBet">R$ 0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Último Ganho</div>
                <div class="stat-value" id="lastWin">R$ 0</div>
            </div>
        </div>
    </div>

    <script>
        const symbols = ['🍒', '🍋', '🍊', '🍇', '🍉', '⭐', '💎'];
        let balance = 1000;
        let isSpinning = false;

        function pullLever() {
            if (isSpinning) return;
            
            const lever = document.getElementById('lever');
            lever.classList.add('pulled');
            
            setTimeout(() => {
                lever.classList.remove('pulled');
            }, 300);
            
            spin();
        }

        function spin() {
            if (isSpinning) return;
            
            const bet = parseFloat(document.getElementById('betAmount').value);
            if (bet <= 0 || bet > balance) {
                showMessage('Aposta inválida!', 'lose');
                return;
            }

            balance -= bet;
            updateBalance();
            document.getElementById('lastBet').textContent = `R$ ${bet.toFixed(2)}`;
            document.getElementById('message').textContent = '';
            
            isSpinning = true;
            document.getElementById('leverContainer').style.cursor = 'not-allowed';

            const slot1 = document.getElementById('slot1');
            const slot2 = document.getElementById('slot2');
            const slot3 = document.getElementById('slot3');

            slot1.classList.add('spinning');
            slot2.classList.add('spinning');
            slot3.classList.add('spinning');

            let counter = 0;
            const interval = setInterval(() => {
                slot1.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                slot2.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                slot3.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                counter++;

                if (counter > 20) {
                    clearInterval(interval);
                    slot1.classList.remove('spinning');
                    slot2.classList.remove('spinning');
                    slot3.classList.remove('spinning');

                    // Resultado final com chance de perder aumentada
                    const rand = Math.random();
                    let result1, result2, result3;

                    if (rand < 0.02) { // 2% - Jackpot (3 diamantes)
                        result1 = result2 = result3 = '💎';
                    } else if (rand < 0.05) { // 3% - 3 iguais (estrelas)
                        result1 = result2 = result3 = '⭐';
                    } else if (rand < 0.15) { // 10% - 3 iguais (frutas)
                        const fruit = symbols[Math.floor(Math.random() * 5)];
                        result1 = result2 = result3 = fruit;
                    } else if (rand < 0.30) { // 15% - 2 iguais
                        result1 = result2 = symbols[Math.floor(Math.random() * symbols.length)];
                        result3 = symbols[Math.floor(Math.random() * symbols.length)];
                        while (result3 === result1) {
                            result3 = symbols[Math.floor(Math.random() * symbols.length)];
                        }
                    } else { // 70% - Perder
                        result1 = symbols[Math.floor(Math.random() * symbols.length)];
                        result2 = symbols[Math.floor(Math.random() * symbols.length)];
                        result3 = symbols[Math.floor(Math.random() * symbols.length)];
                        while (result2 === result1) {
                            result2 = symbols[Math.floor(Math.random() * symbols.length)];
                        }
                        while (result3 === result1 || result3 === result2) {
                            result3 = symbols[Math.floor(Math.random() * symbols.length)];
                        }
                    }

                    slot1.textContent = result1;
                    slot2.textContent = result2;
                    slot3.textContent = result3;

                    checkWin(result1, result2, result3, bet);
                    isSpinning = false;
                    document.getElementById('leverContainer').style.cursor = 'pointer';
                }
            }, 100);
        }

        function checkWin(s1, s2, s3, bet) {
            let winAmount = 0;
            let message = '';

            if (s1 === s2 && s2 === s3) {
                if (s1 === '💎') {
                    winAmount = bet * 50;
                    message = '💎 JACKPOT! 50x';
                } else if (s1 === '⭐') {
                    winAmount = bet * 20;
                    message = '⭐ INCRÍVEL! 20x';
                } else {
                    winAmount = bet * 10;
                    message = '🎉 3 IGUAIS! 10x';
                }
            } else if (s1 === s2 || s2 === s3 || s1 === s3) {
                winAmount = bet * 2;
                message = '👍 2 IGUAIS! 2x';
            } else {
                message = '😢 Tente novamente!';
            }

            if (winAmount > 0) {
                balance += winAmount;
                showMessage(message, 'win');
            } else {
                showMessage(message, 'lose');
            }

            document.getElementById('lastWin').textContent = `R$ ${winAmount.toFixed(2)}`;
            updateBalance();
        }

        function updateBalance() {
            document.getElementById('balance').textContent = `R$ ${balance.toFixed(2)}`;
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
        }
    </script>
</body>
</html>
