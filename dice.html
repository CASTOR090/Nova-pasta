<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Dados</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3a 50%, #2d1b69 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container {
            background: rgba(0, 0, 0, 0.9);
            padding: 50px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            max-width: 800px;
            width: 100%;
            border: 2px solid #ffd700;
        }
        h1 {
            font-size: 4em;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ffd700, #ffed4e, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        .nav-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .dice-area {
            background: radial-gradient(circle, #1a5f1a 0%, #0d3d0d 100%);
            padding: 60px;
            border-radius: 25px;
            margin: 40px 0;
            border: 4px solid #ffd700;
            position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .dice-area::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ffd700, #ffed4e, #ffd700, #ffed4e);
            border-radius: 25px;
            z-index: -1;
            animation: borderGlow 2s ease-in-out infinite alternate;
        }
        @keyframes borderGlow {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .dice-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin: 30px 0;
        }
        .dice {
            width: 100px;
            height: 100px;
            background: #fff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0;
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: all 0.2s;
            position: relative;
        }
        .dice-dot {
            width: 12px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            position: absolute;
        }
        .dice-1 .dot1 { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .dice-2 .dot1 { top: 25%; left: 25%; }
        .dice-2 .dot2 { bottom: 25%; right: 25%; }
        .dice-3 .dot1 { top: 25%; left: 25%; }
        .dice-3 .dot2 { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .dice-3 .dot3 { bottom: 25%; right: 25%; }
        .dice-4 .dot1 { top: 25%; left: 25%; }
        .dice-4 .dot2 { top: 25%; right: 25%; }
        .dice-4 .dot3 { bottom: 25%; left: 25%; }
        .dice-4 .dot4 { bottom: 25%; right: 25%; }
        .dice-5 .dot1 { top: 25%; left: 25%; }
        .dice-5 .dot2 { top: 25%; right: 25%; }
        .dice-5 .dot3 { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .dice-5 .dot4 { bottom: 25%; left: 25%; }
        .dice-5 .dot5 { bottom: 25%; right: 25%; }
        .dice-6 .dot1 { top: 25%; left: 25%; }
        .dice-6 .dot2 { top: 25%; right: 25%; }
        .dice-6 .dot3 { top: 50%; left: 25%; }
        .dice-6 .dot4 { top: 50%; right: 25%; }
        .dice-6 .dot5 { bottom: 25%; left: 25%; }
        .dice-6 .dot6 { bottom: 25%; right: 25%; }
        .dice.rolling {
            animation: smoothRoll 0.08s ease-in-out infinite;
        }
        @keyframes smoothRoll {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.05); }
            50% { transform: rotate(180deg) scale(1); }
            75% { transform: rotate(270deg) scale(1.05); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .total {
            font-size: 3em;
            margin: 30px 0;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .bet-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
        }
        .bet-btn {
            padding: 20px 25px;
            font-size: 1.2em;
            background: linear-gradient(145deg, #4a4a4a 0%, #2a2a2a 100%);
            color: white;
            border: 3px solid #666;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }
        .bet-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .bet-btn:hover:not(:disabled)::before {
            left: 100%;
        }
        .bet-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            border-color: #ffd700;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
        }
        .bet-btn.selected {
            background: linear-gradient(145deg, #ffd700 0%, #ffed4e 100%);
            color: #000;
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6), 0 5px 15px rgba(0,0,0,0.4);
            transform: translateY(-2px);
        }
        .bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .controls {
            margin: 30px 0;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        input {
            padding: 18px;
            font-size: 1.3em;
            border: 3px solid #666;
            border-radius: 15px;
            width: 180px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
        button {
            padding: 18px 50px;
            font-size: 1.4em;
            background: linear-gradient(145deg, #ffd700 0%, #ffed4e 100%);
            color: #000;
            border: 3px solid #ffd700;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(255, 215, 0, 0.5);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 10px;
        }
        .stat-label {
            font-size: 1em;
            opacity: 0.8;
        }
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            margin-top: 5px;
        }
        .message {
            margin-top: 30px;
            font-size: 2em;
            min-height: 60px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .win { color: #00ff88; }
        .lose { color: #ff4444; }
    </style>
</head>
<body>
    <button class="nav-btn" onclick="window.location.href='home.html'">🏠 HOME</button>

    <div class="container">
        <h1>🎲 JOGO DE DADOS</h1>
        
        <div class="dice-area">
            <div class="dice-container">
                <div class="dice dice-1" id="dice1">
                    <div class="dice-dot dot1"></div>
                </div>
                <div class="dice dice-1" id="dice2">
                    <div class="dice-dot dot1"></div>
                </div>
            </div>
            <div class="total" id="total">Total: 2</div>
        </div>

        <div class="bet-options">
            <button class="bet-btn" onclick="selectBet('baixo')" id="btnBaixo">BAIXO (2-6)<br>2x</button>
            <button class="bet-btn" onclick="selectBet('sete')" id="btnSete">SETE (7)<br>5x</button>
            <button class="bet-btn" onclick="selectBet('alto')" id="btnAlto">ALTO (8-12)<br>2x</button>
            <button class="bet-btn" onclick="selectBet('par')" id="btnPar">PAR<br>2x</button>
            <button class="bet-btn" onclick="selectBet('dupla')" id="btnDupla">DUPLA<br>6x</button>
            <button class="bet-btn" onclick="selectBet('impar')" id="btnImpar">ÍMPAR<br>2x</button>
        </div>

        <div class="controls">
            <input type="number" id="betAmount" value="10" min="1" placeholder="Aposta">
            <button id="rollBtn" onclick="rollDice()">ROLAR DADOS</button>
        </div>

        <div class="message" id="message">Escolha sua aposta e role os dados!</div>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Saldo</div>
                <div class="stat-value" id="balance">R$ 1000</div>
            </div>
            <div class="stat">
                <div class="stat-label">Aposta Atual</div>
                <div class="stat-value" id="currentBet">Nenhuma</div>
            </div>
            <div class="stat">
                <div class="stat-label">Último Ganho</div>
                <div class="stat-value" id="lastWin">R$ 0</div>
            </div>
        </div>
    </div>

    <script>
        const diceSymbols = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        let balance = 1000;
        let selectedBet = null;
        let isRolling = false;

        function selectBet(betType) {
            if (isRolling) return;
            
            // Remove seleção anterior
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            // Adiciona nova seleção
            document.getElementById(`btn${betType.charAt(0).toUpperCase() + betType.slice(1)}`).classList.add('selected');
            selectedBet = betType;
            
            const betNames = {
                'baixo': 'BAIXO (2-6)',
                'sete': 'SETE (7)',
                'alto': 'ALTO (8-12)',
                'par': 'PAR',
                'dupla': 'DUPLA',
                'impar': 'ÍMPAR'
            };
            
            document.getElementById('currentBet').textContent = betNames[betType];
        }

        function updateDice(diceElement, value) {
            diceElement.className = `dice dice-${value}`;
            diceElement.innerHTML = '';
            
            for (let i = 1; i <= value; i++) {
                const dot = document.createElement('div');
                dot.className = `dice-dot dot${i}`;
                diceElement.appendChild(dot);
            }
        }

        function rollDice() {
            if (isRolling || !selectedBet) {
                if (!selectedBet) {
                    showMessage('Escolha uma aposta primeiro!', 'lose');
                }
                return;
            }

            const bet = parseFloat(document.getElementById('betAmount').value);
            if (bet <= 0 || bet > balance) {
                showMessage('Aposta inválida!', 'lose');
                return;
            }

            balance -= bet;
            updateBalance();
            isRolling = true;
            document.getElementById('rollBtn').disabled = true;

            const dice1 = document.getElementById('dice1');
            const dice2 = document.getElementById('dice2');
            
            dice1.classList.add('rolling');
            dice2.classList.add('rolling');

            let counter = 0;
            const interval = setInterval(() => {
                const randomValue1 = Math.floor(Math.random() * 6) + 1;
                const randomValue2 = Math.floor(Math.random() * 6) + 1;
                updateDice(dice1, randomValue1);
                updateDice(dice2, randomValue2);
                counter++;

                if (counter > 25) {
                    clearInterval(interval);
                    
                    // Resultado final
                    const result1 = Math.floor(Math.random() * 6) + 1;
                    const result2 = Math.floor(Math.random() * 6) + 1;
                    const total = result1 + result2;
                    
                    updateDice(dice1, result1);
                    updateDice(dice2, result2);
                    document.getElementById('total').textContent = `Total: ${total}`;
                    
                    dice1.classList.remove('rolling');
                    dice2.classList.remove('rolling');
                    
                    checkWin(result1, result2, total, bet);
                    
                    isRolling = false;
                    document.getElementById('rollBtn').disabled = false;
                }
            }, 80);
        }

        function checkWin(dice1, dice2, total, bet) {
            let won = false;
            let multiplier = 0;
            let message = '';

            switch(selectedBet) {
                case 'baixo':
                    won = total >= 2 && total <= 6;
                    multiplier = 2;
                    message = won ? `🎉 BAIXO! Total: ${total}` : `😢 Total: ${total} (não é baixo)`;
                    break;
                case 'sete':
                    won = total === 7;
                    multiplier = 5;
                    message = won ? `🎯 SETE PERFEITO!` : `😢 Total: ${total} (não é 7)`;
                    break;
                case 'alto':
                    won = total >= 8 && total <= 12;
                    multiplier = 2;
                    message = won ? `🎉 ALTO! Total: ${total}` : `😢 Total: ${total} (não é alto)`;
                    break;
                case 'par':
                    won = total % 2 === 0;
                    multiplier = 2;
                    message = won ? `✅ PAR! Total: ${total}` : `😢 Total: ${total} (ímpar)`;
                    break;
                case 'dupla':
                    won = dice1 === dice2;
                    multiplier = 6;
                    message = won ? `🎲 DUPLA ${dice1}!` : `😢 ${dice1} e ${dice2} (não é dupla)`;
                    break;
                case 'impar':
                    won = total % 2 === 1;
                    multiplier = 2;
                    message = won ? `✅ ÍMPAR! Total: ${total}` : `😢 Total: ${total} (par)`;
                    break;
            }

            let winAmount = 0;
            if (won) {
                winAmount = bet * multiplier;
                balance += winAmount;
                showMessage(message + ` - Ganhou R$ ${winAmount.toFixed(2)}!`, 'win');
            } else {
                showMessage(message, 'lose');
            }

            document.getElementById('lastWin').textContent = `R$ ${winAmount.toFixed(2)}`;
            updateBalance();
        }

        function updateBalance() {
            document.getElementById('balance').textContent = `R$ ${balance.toFixed(2)}`;
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
        }
    </script>
</body>
</html>
