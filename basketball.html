<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Basquete</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            max-width: 700px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 30px;
            color: #ffd700;
        }
        .nav-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .court {
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 100%);
            padding: 40px 20px;
            border-radius: 20px;
            position: relative;
            min-height: 500px;
            border: 5px solid #654321;
        }
        .hoop-area {
            position: relative;
            margin-bottom: 50px;
        }
        .hoop {
            font-size: 8em;
            margin: 20px 0;
        }
        .ball {
            position: absolute;
            font-size: 4em;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
        }
        .ball.shooting {
            animation: shoot 1s ease-out forwards;
        }
        @keyframes shoot {
            0% { bottom: 50px; left: 50%; transform: translateX(-50%) scale(1); }
            50% { bottom: 350px; left: 50%; transform: translateX(-50%) scale(0.6); }
            100% { bottom: 250px; left: 50%; transform: translateX(-50%) scale(0.8); opacity: 0; }
        }
        .ball.score {
            animation: scoreShot 1s ease-out forwards;
        }
        @keyframes scoreShot {
            0% { bottom: 50px; left: 50%; transform: translateX(-50%) scale(1); }
            40% { bottom: 350px; left: 50%; transform: translateX(-50%) scale(0.6); }
            60% { bottom: 280px; left: 50%; transform: translateX(-50%) scale(0.5); }
            100% { bottom: 200px; left: 50%; transform: translateX(-50%) scale(0.3); opacity: 0; }
        }
        .shoot-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }
        .shoot-btn {
            padding: 20px 40px;
            font-size: 1.5em;
            background: #ff6b35;
            color: white;
            border: 3px solid white;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .shoot-btn:hover:not(:disabled) {
            transform: scale(1.1);
            background: #f7931e;
        }
        .shoot-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .controls {
            margin: 30px 0;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        input {
            padding: 15px;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            width: 150px;
            text-align: center;
        }
        button {
            padding: 15px 40px;
            font-size: 1.3em;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover:not(:disabled) {
            transform: scale(1.05);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 10px;
        }
        .stat-label {
            font-size: 1em;
            opacity: 0.8;
        }
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            margin-top: 5px;
        }
        .message {
            margin-top: 20px;
            font-size: 1.8em;
            min-height: 40px;
            font-weight: bold;
        }
        .win { color: #00ff88; }
        .lose { color: #ff4444; }
        .info {
            font-size: 1.3em;
            margin: 20px 0;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <button class="nav-btn" onclick="window.location.href='home.html'">🏠 HOME</button>

    <div class="container">
        <h1>🏀 JOGO DE BASQUETE</h1>
        
        <div class="info" id="info">Clique em INICIAR para jogar!</div>

        <div class="court">
            <div class="hoop-area">
                <div class="hoop">🏀</div>
                <div class="ball" id="ball">🏀</div>
            </div>

            <div class="shoot-buttons" id="shootButtons" style="display: none;">
                <button class="shoot-btn" onclick="shoot('left')">⬅️ ESQUERDA</button>
                <button class="shoot-btn" onclick="shoot('center')">🎯 CENTRO</button>
                <button class="shoot-btn" onclick="shoot('right')">➡️ DIREITA</button>
            </div>
        </div>

        <div class="controls">
            <input type="number" id="betAmount" value="10" min="1" placeholder="Aposta">
            <button id="startBtn" onclick="startGame()">INICIAR</button>
        </div>

        <div class="message" id="message"></div>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Saldo</div>
                <div class="stat-value" id="balance">R$ 1000</div>
            </div>
            <div class="stat">
                <div class="stat-label">Cestas</div>
                <div class="stat-value" id="baskets">0/5</div>
            </div>
            <div class="stat">
                <div class="stat-label">Último Ganho</div>
                <div class="stat-value" id="lastWin">R$ 0</div>
            </div>
        </div>
    </div>

    <script>
        let balance = 1000;
        let currentBet = 0;
        let isPlaying = false;
        let basketsMade = 0;
        let shotsLeft = 5;

        function startGame() {
            const bet = parseFloat(document.getElementById('betAmount').value);
            if (bet <= 0 || bet > balance) {
                showMessage('Aposta inválida!', 'lose');
                return;
            }

            balance -= bet;
            currentBet = bet;
            isPlaying = true;
            basketsMade = 0;
            shotsLeft = 5;

            updateBalance();
            updateBaskets();

            document.getElementById('startBtn').disabled = true;
            document.getElementById('betAmount').disabled = true;
            document.getElementById('shootButtons').style.display = 'flex';
            document.getElementById('info').textContent = `Arremessos restantes: ${shotsLeft}`;
            showMessage('Escolha a posição e arremesse!', '');
        }

        function shoot(position) {
            if (!isPlaying || shotsLeft <= 0) return;

            const buttons = document.querySelectorAll('.shoot-btn');
            buttons.forEach(btn => btn.disabled = true);

            const ball = document.getElementById('ball');
            
            // Calcular chance de acerto
            let hitChance;
            if (position === 'center') {
                hitChance = 0.50; // 50% centro
            } else {
                hitChance = 0.35; // 35% laterais
            }

            const scored = Math.random() < hitChance;

            if (scored) {
                ball.className = 'ball score';
                basketsMade++;
                setTimeout(() => {
                    showMessage('🏀 CESTA!', 'win');
                }, 500);
            } else {
                ball.className = 'ball shooting';
                setTimeout(() => {
                    showMessage('❌ ERROU!', 'lose');
                }, 500);
            }

            shotsLeft--;
            updateBaskets();

            setTimeout(() => {
                ball.className = 'ball';
                
                if (shotsLeft > 0) {
                    buttons.forEach(btn => btn.disabled = false);
                    document.getElementById('info').textContent = `Arremessos restantes: ${shotsLeft}`;
                } else {
                    endGame();
                }
            }, 1200);
        }

        function endGame() {
            isPlaying = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('betAmount').disabled = false;
            document.getElementById('shootButtons').style.display = 'none';

            let winAmount = 0;
            let message = '';

            if (basketsMade === 5) {
                winAmount = currentBet * 15;
                message = `🏆 PERFEITO! 5/5 cestas! Ganhou R$ ${winAmount.toFixed(2)}`;
            } else if (basketsMade === 4) {
                winAmount = currentBet * 8;
                message = `⭐ EXCELENTE! 4/5 cestas! Ganhou R$ ${winAmount.toFixed(2)}`;
            } else if (basketsMade === 3) {
                winAmount = currentBet * 4;
                message = `👍 BOM! 3/5 cestas! Ganhou R$ ${winAmount.toFixed(2)}`;
            } else if (basketsMade === 2) {
                winAmount = currentBet * 2;
                message = `😊 2/5 cestas! Ganhou R$ ${winAmount.toFixed(2)}`;
            } else {
                message = `😢 Apenas ${basketsMade}/5 cestas. Perdeu!`;
            }

            if (winAmount > 0) {
                balance += winAmount;
                showMessage(message, 'win');
            } else {
                showMessage(message, 'lose');
            }

            document.getElementById('lastWin').textContent = `R$ ${winAmount.toFixed(2)}`;
            document.getElementById('info').textContent = 'Clique em INICIAR para jogar novamente!';
            updateBalance();
        }

        function updateBalance() {
            document.getElementById('balance').textContent = `R$ ${balance.toFixed(2)}`;
        }

        function updateBaskets() {
            document.getElementById('baskets').textContent = `${basketsMade}/5`;
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
        }
    </script>
</body>
</html>
