<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Aviator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        .game-area {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            margin: 20px 0;
            position: relative;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .multiplier {
            font-size: 4em;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        .plane {
            font-size: 3em;
            position: absolute;
            transition: all 0.1s linear;
        }
        .crashed {
            color: #ff4444;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-direction: column;
        }
        .bet-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        input {
            padding: 12px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            width: 150px;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-start {
            background: #00ff88;
            color: #000;
        }
        .btn-cashout {
            background: #ffd700;
            color: #000;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .stat {
            display: flex;
            flex-direction: column;
        }
        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 5px;
        }
        .message {
            margin-top: 15px;
            font-size: 1.2em;
            min-height: 30px;
            font-weight: bold;
        }
        .win {
            color: #00ff88;
        }
        .lose {
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✈️ AVIATOR</h1>
        
        <div class="game-area">
            <div class="plane" id="plane">✈️</div>
            <div class="multiplier" id="multiplier">1.00x</div>
        </div>

        <div class="controls">
            <div class="bet-controls">
                <input type="number" id="betAmount" value="10" min="1" placeholder="Aposta">
                <button class="btn-start" id="startBtn" onclick="startGame()">APOSTAR</button>
            </div>
            <button class="btn-cashout" id="cashoutBtn" onclick="cashout()" disabled>SACAR</button>
        </div>

        <div class="message" id="message"></div>

        <div class="stats">
            <div class="stat">
                <span class="stat-label">Saldo</span>
                <span class="stat-value" id="balance">R$ 1000</span>
            </div>
            <div class="stat">
                <span class="stat-label">Última Aposta</span>
                <span class="stat-value" id="lastBet">R$ 0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Último Ganho</span>
                <span class="stat-value" id="lastWin">R$ 0</span>
            </div>
        </div>
    </div>

    <script>
        let balance = 1000;
        let currentBet = 0;
        let multiplier = 1.00;
        let isPlaying = false;
        let gameInterval;
        let crashPoint;
        let planePosition = { x: 10, y: 50 };

        function updateDisplay() {
            document.getElementById('balance').textContent = `R$ ${balance.toFixed(2)}`;
            document.getElementById('multiplier').textContent = `${multiplier.toFixed(2)}x`;
        }

        function startGame() {
            const betAmount = parseFloat(document.getElementById('betAmount').value);
            
            if (betAmount <= 0 || betAmount > balance) {
                showMessage('Aposta inválida!', 'lose');
                return;
            }

            balance -= betAmount;
            currentBet = betAmount;
            multiplier = 1.00;
            isPlaying = true;
            planePosition = { x: 10, y: 50 };
            
            crashPoint = Math.random() * 4 + 1.5;
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('cashoutBtn').disabled = false;
            document.getElementById('betAmount').disabled = true;
            document.getElementById('message').textContent = '';
            document.getElementById('lastBet').textContent = `R$ ${betAmount.toFixed(2)}`;
            
            updateDisplay();
            animatePlane();
            
            gameInterval = setInterval(() => {
                multiplier += 0.01;
                
                if (multiplier >= crashPoint) {
                    crash();
                }
                
                updateDisplay();
            }, 50);
        }

        function animatePlane() {
            if (!isPlaying) return;
            
            planePosition.x += 1;
            planePosition.y -= 0.5;
            
            const plane = document.getElementById('plane');
            plane.style.left = `${planePosition.x}%`;
            plane.style.bottom = `${planePosition.y}%`;
            
            if (isPlaying) {
                requestAnimationFrame(animatePlane);
            }
        }

        function cashout() {
            if (!isPlaying) return;
            
            const winAmount = currentBet * multiplier;
            balance += winAmount;
            
            document.getElementById('lastWin').textContent = `R$ ${winAmount.toFixed(2)}`;
            showMessage(`Você ganhou R$ ${winAmount.toFixed(2)}!`, 'win');
            
            endGame();
        }

        function crash() {
            document.getElementById('multiplier').classList.add('crashed');
            document.getElementById('lastWin').textContent = `R$ 0.00`;
            showMessage(`CRASH em ${multiplier.toFixed(2)}x! Você perdeu!`, 'lose');
            endGame();
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('cashoutBtn').disabled = true;
            document.getElementById('betAmount').disabled = false;
            
            setTimeout(() => {
                document.getElementById('multiplier').classList.remove('crashed');
                document.getElementById('plane').style.left = '10%';
                document.getElementById('plane').style.bottom = '50%';
            }, 1000);
            
            updateDisplay();
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
        }

        updateDisplay();
    </script>
</body>
</html>
