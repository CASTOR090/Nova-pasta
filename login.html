<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f4c3a, #1a5f4a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 30px;
            color: #ffd700;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #444;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #ffd700;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #228B22;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.3s;
        }
        button:hover {
            background: #32CD32;
        }
        .toggle-btn {
            background: transparent;
            color: #ffd700;
            text-decoration: underline;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .error {
            color: #ff4444;
            margin-top: 10px;
        }
        .success {
            color: #44ff44;
            margin-top: 10px;
        }
        #cadastroForm {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 CASINO</h1>
        
        <!-- Formulário de Login -->
        <div id="loginForm">
            <h2>Login</h2>
            <form onsubmit="login(event)">
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Senha:</label>
                    <input type="password" id="loginSenha" required>
                </div>
                <button type="submit">ENTRAR</button>
            </form>
            <button class="toggle-btn" onclick="toggleForm()">Não tem conta? Cadastre-se</button>
        </div>

        <!-- Formulário de Cadastro -->
        <div id="cadastroForm">
            <h2>Cadastro</h2>
            <form onsubmit="cadastro(event)">
                <div class="form-group">
                    <label>Nome:</label>
                    <input type="text" id="cadastroNome" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="cadastroEmail" required>
                </div>
                <div class="form-group">
                    <label>Senha:</label>
                    <input type="password" id="cadastroSenha" required>
                </div>
                <button type="submit">CADASTRAR</button>
            </form>
            <button class="toggle-btn" onclick="toggleForm()">Já tem conta? Faça login</button>
        </div>

        <div id="message"></div>
    </div>

    <script>
        function toggleForm() {
            const loginForm = document.getElementById('loginForm');
            const cadastroForm = document.getElementById('cadastroForm');
            
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                cadastroForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                cadastroForm.style.display = 'block';
            }
            document.getElementById('message').innerHTML = '';
        }

        async function cadastro(event) {
            event.preventDefault();
            
            const nome = document.getElementById('cadastroNome').value;
            const email = document.getElementById('cadastroEmail').value;
            const senha = document.getElementById('cadastroSenha').value;
            
            try {
                const response = await fetch('http://localhost:8080/api/cadastro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ nome, email, senha })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('message').innerHTML = '<div class="success">Cadastro realizado com sucesso!</div>';
                    setTimeout(() => toggleForm(), 2000);
                } else {
                    document.getElementById('message').innerHTML = `<div class="error">${data.error}</div>`;
                }
            } catch (error) {
                document.getElementById('message').innerHTML = '<div class="error">Erro de conexão com o servidor!</div>';
            }
        }

        async function login(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;
            
            try {
                const response = await fetch('http://localhost:8080/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, senha })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('userId', data.user_id);
                    localStorage.setItem('userName', data.nome);
                    window.location.href = 'home.html';
                } else {
                    document.getElementById('message').innerHTML = `<div class="error">${data.error}</div>`;
                }
            } catch (error) {
                document.getElementById('message').innerHTML = '<div class="error">Erro de conexão com o servidor!</div>';
            }
        }
    </script>
</body>
</html>
